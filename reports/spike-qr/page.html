<!doctype html>
<!-- Task-31 spike template, round two. One template, two pages: build.py fills __PAGE__ with
     "send" or "receive" and spike.js builds that page's controls. Nothing is loaded from
     anywhere: the CSS, jsQR, qr.js, scan.js, the payload constant and spike.js are all inlined
     by build.py. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Crosscheck transfer v3 spike &mdash; __PAGE__</title>
    <!-- CSS -->
  </head>
  <body data-page="__PAGE__">
    <!-- The send page clones this for its frame. The SVG element is written here, in markup,
         rather than built in spike.js: the namespace URL would be a literal and the closing
         tags cannot appear inside the inlined script. -->
    <template id="frame-proto"><svg class="spike-svg" viewBox="0 0 1 1" shape-rendering="crispEdges"><path fill="#000000"></path></svg></template>
    <main id="app"></main>
    <!-- JS -->
  </body>
</html>
