          <div class="community-header">
            <h2 class="community-header__name">Baniyala</h2>

            </div>
            <div class="publisher-row">

            </div>
            <div class="publisher-row">

              <div class="publisher-row__detail">Telstra <span class="fig fig--xs">19 m</span> mast at <span class="fig fig--xs">0.17 km</span>, Baniyala Community</div>
              <span class="source-line">ACMA RRL · <span class="fig fig--xs">2026-09-12</span></span>
            </div>
            <div class="publisher-row">
              <div class="publisher-row__top"><span class="publisher-row__name">BushTel</span><span class="kind-chip">portal</span><span class="says">Not recorded</span></div>
              <div class="publisher-row__detail">Mobile phone row not recorded</div>
              <span class="source-line">BushTel profile · <span class="fig fig--xs">2025-08-06</span></span>
            </div>
          </section>

            <h2 class="section__title">What the connection allows</h2>
            <div class="service-row">
              <button type="button" class="service-row__button" aria-expanded="false"><span class="service-row__top"><span class="service-row__name">Telehealth video</span><span class="verdict-badge verdict-badge--fails"><span aria-hidden="true">■</span>Fails</span></span><span class="service-row__reason">Latency <span class="fig">664.9 ms</span> on satellite vs <span class="fig">100 ms</span> required; no carrier 4G polygon</span></button>
