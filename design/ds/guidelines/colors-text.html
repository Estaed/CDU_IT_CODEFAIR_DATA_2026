</head><body><div class="sw"><i style="background:var(--color-ink)"></i><b>Ink</b><code>--color-ink</code></div><div class="sw"><i style="background:var(--color-body)"></i><b>Body</b><code>--color-body</code></div><div class="sw"><i style="background:var(--color-muted)"></i><b>Muted</b><code>--color-muted</code></div><div class="sw"><i style="background:var(--color-muted-soft)"></i><b>Muted soft</b><code>--color-muted-soft</code></div><div class="sw"><i style="background:var(--color-on-primary)"></i><b>On primary</b><code>--color-on-primary</code></div></body></html>
