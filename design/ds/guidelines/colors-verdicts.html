<!-- @dsCard group="Colors" viewport="700x170" name="Verdicts" subtitle="Glyph + word + colour, always together; text and soft fill per verdict" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{width:120px}.sw i{display:block;height:56px;border:1px solid var(--border-hairline);border-radius:var(--radius-xs)}.sw b{display:block;font:var(--text-label);color:var(--text-heading);margin-top:6px}.sw code{display:block;font:var(--text-figure-xs);color:var(--text-secondary)}.k{font:var(--text-caption);color:var(--text-secondary);width:100%}.mono{font:var(--text-figure-xs);color:var(--text-secondary)}</style>
</head><body><div style="width:150px"><div style="display:inline-flex;align-items:center;gap:4px;height:var(--size-badge);padding:0 8px;border-radius:var(--radius-xs);font:var(--text-label);color:var(--verdict-works-text);background:var(--verdict-works-fill)"><span style="font-size:11px;line-height:1">●</span>Works</div>
<div style="display:flex;gap:6px;margin-top:8px"><span style="flex:1;height:36px;background:var(--verdict-works-text);border-radius:var(--radius-xs)"></span><span style="flex:1;height:36px;background:var(--verdict-works-fill);border:1px solid var(--border-hairline);border-radius:var(--radius-xs)"></span></div>
<code class="mono" style="display:block;margin-top:6px">--verdict-works-text<br>--verdict-works-fill</code></div><div style="width:150px"><div style="display:inline-flex;align-items:center;gap:4px;height:var(--size-badge);padding:0 8px;border-radius:var(--radius-xs);font:var(--text-label);color:var(--verdict-degraded-text);background:var(--verdict-degraded-fill)"><span style="font-size:11px;line-height:1">▲</span>Degraded</div>
<div style="display:flex;gap:6px;margin-top:8px"><span style="flex:1;height:36px;background:var(--verdict-degraded-text);border-radius:var(--radius-xs)"></span><span style="flex:1;height:36px;background:var(--verdict-degraded-fill);border:1px solid var(--border-hairline);border-radius:var(--radius-xs)"></span></div>
<code class="mono" style="display:block;margin-top:6px">--verdict-degraded-text<br>--verdict-degraded-fill</code></div><div style="width:150px"><div style="display:inline-flex;align-items:center;gap:4px;height:var(--size-badge);padding:0 8px;border-radius:var(--radius-xs);font:var(--text-label);color:var(--verdict-fails-text);background:var(--verdict-fails-fill)"><span style="font-size:11px;line-height:1">■</span>Fails</div>
<div style="display:flex;gap:6px;margin-top:8px"><span style="flex:1;height:36px;background:var(--verdict-fails-text);border-radius:var(--radius-xs)"></span><span style="flex:1;height:36px;background:var(--verdict-fails-fill);border:1px solid var(--border-hairline);border-radius:var(--radius-xs)"></span></div>
<code class="mono" style="display:block;margin-top:6px">--verdict-fails-text<br>--verdict-fails-fill</code></div><div style="width:150px"><div style="display:inline-flex;align-items:center;gap:4px;height:var(--size-badge);padding:0 8px;border-radius:var(--radius-xs);font:var(--text-label);color:var(--verdict-nodata-text);background:var(--verdict-nodata-fill)"><span style="font-size:11px;line-height:1">–</span>No data</div>
<div style="display:flex;gap:6px;margin-top:8px"><span style="flex:1;height:36px;background:var(--verdict-nodata-text);border-radius:var(--radius-xs)"></span><span style="flex:1;height:36px;background:var(--verdict-nodata-fill);border:1px solid var(--border-hairline);border-radius:var(--radius-xs)"></span></div>
<code class="mono" style="display:block;margin-top:6px">--verdict-nodata-text<br>--verdict-nodata-fill</code></div></body></html>
