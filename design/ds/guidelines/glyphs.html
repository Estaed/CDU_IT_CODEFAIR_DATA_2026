<!-- @dsCard group="Brand" viewport="700x160" name="Verdict glyphs and map shapes" subtitle="The four glyphs are the only symbols in the system; they double as map point shapes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{width:120px}.sw i{display:block;height:56px;border:1px solid var(--border-hairline);border-radius:var(--radius-xs)}.sw b{display:block;font:var(--text-label);color:var(--text-heading);margin-top:6px}.sw code{display:block;font:var(--text-figure-xs);color:var(--text-secondary)}.k{font:var(--text-caption);color:var(--text-secondary);width:100%}.mono{font:var(--text-figure-xs);color:var(--text-secondary)}</style>
</head><body><div style="width:150px;display:flex;align-items:center;gap:12px"><span style="font-size:28px;line-height:1;color:var(--verdict-works-text)">●</span><svg width="28" height="28" viewBox="-14 -14 28 28"><circle r="8" fill="var(--verdict-works-text)"/></svg><span class="mono">works<br>circle</span></div><div style="width:150px;display:flex;align-items:center;gap:12px"><span style="font-size:28px;line-height:1;color:var(--verdict-degraded-text)">▲</span><svg width="28" height="28" viewBox="-14 -14 28 28"><polygon points="0,-9 9,7 -9,7" fill="var(--verdict-degraded-text)"/></svg><span class="mono">degraded<br>triangle</span></div><div style="width:150px;display:flex;align-items:center;gap:12px"><span style="font-size:28px;line-height:1;color:var(--verdict-fails-text)">■</span><svg width="28" height="28" viewBox="-14 -14 28 28"><rect x="-8" y="-8" width="16" height="16" fill="var(--verdict-fails-text)"/></svg><span class="mono">fails<br>square</span></div><div style="width:150px;display:flex;align-items:center;gap:12px"><span style="font-size:28px;line-height:1;color:var(--verdict-nodata-text)">–</span><svg width="28" height="28" viewBox="-14 -14 28 28"><rect x="-8" y="-2" width="16" height="4" fill="var(--verdict-nodata-text)"/></svg><span class="mono">nodata<br>dash</span></div><div class="k">No icons, no emoji, no icon font. Wherever an icon would go, write the word.</div></body></html>
